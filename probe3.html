<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>sonde3</title>
  </head>
  <body>
    <iframe id="f" src="/index.html" style="width: 1280px; height: 900px; border: 0"></iframe>
    <pre id="out">running…</pre>
    <script type="module">
      const q = new URLSearchParams(location.search)
      new Image().src = 'http://127.0.0.1:5198/DEBUT'
      const out = document.getElementById('out')
      const f = document.getElementById('f')
      const logs = []
      window.addEventListener('error', (e) => {
        new Image().src = 'http://127.0.0.1:5198/ERREUR%20' + encodeURIComponent(String(e.message))
      })
      await new Promise((r) => f.addEventListener('load', r, { once: true }))
      await new Promise((r) => setTimeout(r, 2000))
      const w = f.contentWindow
      const d = f.contentDocument
      const step = (name, fn) => {
        try {
          logs.push(name + ' -> ' + JSON.stringify(fn()))
        } catch (e) {
          logs.push(name + ' !! ' + e.name + ': ' + e.message)
        }
      }
      const info = (l) => {
        const r = l.getBoundingClientRect()
        return {
          hidden: l.hidden,
          display: w.getComputedStyle(l).display,
          w: Math.round(r.width),
          h: Math.round(r.height),
          top: Math.round(r.top),
          left: Math.round(r.left),
        }
      }
      step('liste AVANT clic', () => info(d.querySelector('.doli-select__list')))
      d.querySelector('.login-screen')?.setAttribute('hidden', '')
      d.querySelector('.app-shell')?.removeAttribute('hidden')
      step('liste APRES app-shell', () => info(d.querySelector('.doli-select__list')))
      step('clic Ajouter', () => {
        d.getElementById('addTaskBtn').click()
        const o = d.getElementById('taskModalOverlay')
        const m = o.querySelector('.modal')
        const r = m.getBoundingClientRect()
        const cx = Math.round(r.left + r.width / 2)
        const cy = Math.round(r.top + r.height / 2)
        const top = d.elementFromPoint(cx, cy)
        return {
          overlay: info(o),
          modal: info(m),
          opacityFenetre: w.getComputedStyle(m).opacity,
          auCentre: top ? top.tagName + '.' + String(top.className).slice(0, 36) : null,
          centreDansFenetre: top ? m.contains(top) : null,
        }
      })
      step('controle Priorite', () => {
        const c = d.querySelector('.doli-select__control')
        const r = c.getBoundingClientRect()
        return { w: Math.round(r.width), h: Math.round(r.height), valeur: d.querySelector('.doli-select__value').textContent }
      })
      if (q.has('open')) {
        step('clic Priorite', () => {
          d.querySelector('.doli-select__control').click()
          const l = d.querySelector('.doli-select__list')
          const r = l.getBoundingClientRect()
          return { hidden: l.hidden, display: w.getComputedStyle(l).display, w: Math.round(r.width), h: Math.round(r.height), top: Math.round(r.top) }
        })
        step('clic sur une option', () => {
          const items = d.querySelectorAll('.doli-select__opt')
          items[3].click()
          return { valeurSelect: d.getElementById('taskPriority').value, libelle: d.querySelector('.doli-select__value').textContent }
        })
      }
      out.textContent = logs.join('\n')
      if (q.has('shot')) {
        logs.forEach((l) => new Image())
      } else {
        window.location.href = 'http://127.0.0.1:5198/' + encodeURIComponent(logs.join(' ~ '))
      }
    </script>
  </body>
</html>
